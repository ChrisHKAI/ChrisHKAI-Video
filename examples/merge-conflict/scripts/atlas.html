<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>atlas</title>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Paints each frame's changing textures into one atlas for Blender:
      // the code area, the terminal and the status bar (src/editor.js), plus
      // the glyph sheet and the Ctrl+Z keycap. Driven by scripts/render-atlas.mjs.
      import { drawCode, drawTerm, drawStatus, drawGlyphSheet, drawKeycap } from "/src/editor.js";
      import { ATLAS } from "/src/atlas-layout.js";
      import { GLYPH_SHEET } from "/src/glyphs.js";

      const make = (w, h) => {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return [c, c.getContext("2d")];
      };
      const [atlas, actx] = make(ATLAS.w, ATLAS.h);
      const parts = [
        [ATLAS.code, drawCode],
        [ATLAS.term, drawTerm],
        [ATLAS.status, drawStatus],
      ].map(([r, fn]) => [r, fn, ...make(r[2], r[3])]);

      window.renderAtlas = (t) => {
        actx.clearRect(0, 0, ATLAS.w, ATLAS.h);
        for (const [r, fn, c, ctx] of parts) {
          fn(ctx, t);
          actx.drawImage(c, r[0], r[1]);
        }
        return atlas.toDataURL("image/png");
      };
      window.renderGlyphs = () => {
        const [c, ctx] = make(GLYPH_SHEET[0], GLYPH_SHEET[1]);
        drawGlyphSheet(ctx);
        return c.toDataURL("image/png");
      };
      window.renderKeycap = () => {
        const [c, ctx] = make(512, 256);
        drawKeycap(ctx, 512, 256);
        return c.toDataURL("image/png");
      };
      await document.fonts.load("25px Menlo");
      window.atlasReady = true;
    </script>
  </body>
</html>
