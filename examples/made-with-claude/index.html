<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>No After Effects. Just Clawd.</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #120c0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120c0a;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The comp canvas draws the lockup in Montserrat; naming it here makes
         the compiler embed the bundled family so canvas text can use it. */
      #font-load {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        font-family: Montserrat, sans-serif;
        font-weight: 900;
        color: #ffffff;
        background: #000000;
      }
      #font-load b {
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-hxfu"
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="12"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <canvas data-hf-id="hf-6fhj" id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <div data-hf-id="hf-5ebt" id="font-load" aria-hidden="true">MADE WITH CLAUDE <b data-hf-id="hf-fsig">OPUS 5.5</b></div>
      <audio data-hf-id="hf-wkip"
        id="score"
        src="assets/audio/score.wav"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-volume="1"
      ></audio>
    </div>
    <script type="module" src="src/scene.js"></script>
  </body>
</html>
