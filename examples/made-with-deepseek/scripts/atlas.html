<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>atlas</title>
    <style>
      @font-face {
        font-family: Montserrat;
        font-weight: 900;
        src: url(/build/fonts/montserrat-900.woff2) format("woff2");
      }
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Draws what changes per frame for the Blender build, from the same
      // modules the preview uses: the comp, both timecodes, plus the static
      // card sprite and Glow chip. Driven by scripts/render-atlas.mjs.
      import { drawComp, drawWhale, drawChip, timecode } from "/src/comp.js";
      import * as T from "/src/timeline.js";
      import { ATLAS } from "/src/atlas-layout.js";

      const make = (w, h) => {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return [c, c.getContext("2d")];
      };
      const [atlas, actx] = make(ATLAS.w, ATLAS.h);
      const [comp, cctx] = make(ATLAS.comp[2], ATLAS.comp[3]);

      function tc(text, [x, y, w, h], size) {
        actx.save();
        actx.beginPath();
        actx.rect(x, y, w, h);
        actx.clip();
        actx.font = `600 ${size}px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif`;
        actx.fillStyle = "#4ea3ff";
        actx.textBaseline = "middle";
        actx.fillText(text, x + 6, y + h / 2 + 2);
        actx.restore();
      }

      window.renderAtlas = (t) => {
        actx.clearRect(0, 0, ATLAS.w, ATLAS.h);
        drawComp(cctx, t);
        actx.drawImage(comp, ATLAS.comp[0], ATLAS.comp[1]);
        const s = timecode(T.ctiTime(t));
        tc(s, ATLAS.tcComp, 72);
        tc(s, ATLAS.tcTimeline, 104);
        return atlas.toDataURL("image/png");
      };
      window.renderSprite = () => {
        const [c, ctx] = make(512, 332);
        drawWhale(ctx, 256, 197, 240, { style: "mascot" });
        return c.toDataURL("image/png");
      };
      window.renderChip = () => {
        const [c, ctx] = make(416, 104);
        drawChip(ctx);
        return c.toDataURL("image/png");
      };
      await document.fonts.load("900 100px Montserrat");
      window.atlasReady = true;
    </script>
  </body>
</html>
